services:
  postgres:
    image: postgres:15
    container_name: mindcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: mindcheck
    ports:
      - "5433:5432"
    volumes:
      - mindcheck-postgres-data:/var/lib/postgresql/data

volumes:
  mindcheck-postgres-data:
